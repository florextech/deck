name: Bug Report
description: Report a bug
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      placeholder: Describe the bug
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
  - type: dropdown
    attributes:
      label: OS
      options:
        - macOS
        - Windows
        - Linux
  - type: textarea
    attributes:
      label: Device
      placeholder: "e.g. iPad, Samsung Tab, PC browser"
