<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#09090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Deck</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ─── THEMES ─── */
    [data-theme="midnight"] {
      --bg: #09090b; --glass: rgba(255,255,255,0.04); --glass-strong: rgba(255,255,255,0.07);
      --glass-border: rgba(255,255,255,0.06); --glass-border-active: rgba(167,139,250,0.35);
      --glass-glow: rgba(167,139,250,0.12); --text: #fafafa; --text-dim: #52525b;
      --accent: #a78bfa; --accent-soft: rgba(167,139,250,0.1);
      --green: #4ade80; --red: #f87171; --yellow: #facc15;
      --orb1: rgba(139,92,246,0.08); --orb2: rgba(236,72,153,0.06);
    }
    [data-theme="ocean"] {
      --bg: #0a0f1a; --glass: rgba(56,189,248,0.04); --glass-strong: rgba(56,189,248,0.08);
      --glass-border: rgba(56,189,248,0.1); --glass-border-active: rgba(56,189,248,0.4);
      --glass-glow: rgba(56,189,248,0.15); --text: #f0f9ff; --text-dim: #475569;
      --accent: #38bdf8; --accent-soft: rgba(56,189,248,0.1);
      --green: #34d399; --red: #fb7185; --yellow: #fbbf24;
      --orb1: rgba(6,182,212,0.1); --orb2: rgba(59,130,246,0.08);
    }
    [data-theme="ember"] {
      --bg: #0f0a07; --glass: rgba(251,146,60,0.04); --glass-strong: rgba(251,146,60,0.08);
      --glass-border: rgba(251,146,60,0.08); --glass-border-active: rgba(251,146,60,0.35);
      --glass-glow: rgba(251,146,60,0.12); --text: #fef3c7; --text-dim: #78716c;
      --accent: #fb923c; --accent-soft: rgba(251,146,60,0.1);
      --green: #a3e635; --red: #ef4444; --yellow: #fbbf24;
      --orb1: rgba(234,88,12,0.08); --orb2: rgba(220,38,38,0.05);
    }
    [data-theme="forest"] {
      --bg: #060d08; --glass: rgba(74,222,128,0.04); --glass-strong: rgba(74,222,128,0.07);
      --glass-border: rgba(74,222,128,0.08); --glass-border-active: rgba(74,222,128,0.35);
      --glass-glow: rgba(74,222,128,0.12); --text: #ecfdf5; --text-dim: #4b5563;
      --accent: #4ade80; --accent-soft: rgba(74,222,128,0.1);
      --green: #4ade80; --red: #f87171; --yellow: #fbbf24;
      --orb1: rgba(16,185,129,0.08); --orb2: rgba(5,150,105,0.06);
    }
    [data-theme="rose"] {
      --bg: #0f0a0c; --glass: rgba(244,114,182,0.04); --glass-strong: rgba(244,114,182,0.07);
      --glass-border: rgba(244,114,182,0.08); --glass-border-active: rgba(244,114,182,0.35);
      --glass-glow: rgba(244,114,182,0.12); --text: #fdf2f8; --text-dim: #6b7280;
      --accent: #f472b6; --accent-soft: rgba(244,114,182,0.1);
      --green: #4ade80; --red: #fb7185; --yellow: #fbbf24;
      --orb1: rgba(236,72,153,0.08); --orb2: rgba(168,85,247,0.06);
    }
    [data-theme="ice"] {
      --bg: #070b10; --glass: rgba(103,232,249,0.04); --glass-strong: rgba(103,232,249,0.07);
      --glass-border: rgba(103,232,249,0.08); --glass-border-active: rgba(103,232,249,0.35);
      --glass-glow: rgba(103,232,249,0.12); --text: #ecfeff; --text-dim: #64748b;
      --accent: #67e8f9; --accent-soft: rgba(103,232,249,0.1);
      --green: #4ade80; --red: #f87171; --yellow: #fbbf24;
      --orb1: rgba(34,211,238,0.08); --orb2: rgba(56,189,248,0.06);
    }
    [data-theme="gold"] {
      --bg: #0c0a05; --glass: rgba(251,191,36,0.04); --glass-strong: rgba(251,191,36,0.07);
      --glass-border: rgba(251,191,36,0.08); --glass-border-active: rgba(251,191,36,0.35);
      --glass-glow: rgba(251,191,36,0.12); --text: #fefce8; --text-dim: #78716c;
      --accent: #fbbf24; --accent-soft: rgba(251,191,36,0.1);
      --green: #4ade80; --red: #f87171; --yellow: #fbbf24;
      --orb1: rgba(245,158,11,0.08); --orb2: rgba(217,119,6,0.06);
    }
    [data-theme="crimson"] {
      --bg: #0c0507; --glass: rgba(244,63,94,0.04); --glass-strong: rgba(244,63,94,0.07);
      --glass-border: rgba(244,63,94,0.08); --glass-border-active: rgba(244,63,94,0.35);
      --glass-glow: rgba(244,63,94,0.12); --text: #fff1f2; --text-dim: #6b7280;
      --accent: #f43f5e; --accent-soft: rgba(244,63,94,0.1);
      --green: #4ade80; --red: #fb7185; --yellow: #fbbf24;
      --orb1: rgba(225,29,72,0.08); --orb2: rgba(190,18,60,0.06);
    }

    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
      height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
      user-select: none; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased;
      padding-top: env(titlebar-area-height, 0px);
    }
    /* macOS Electron titlebar space */
    @media (display-mode: standalone), (display-mode: window-controls-overlay) {
      body { padding-top: 28px; }
    }
    body::before, body::after { content:''; position:fixed; border-radius:50%; pointer-events:none; z-index:0; }
    body::before { width:50vw; height:50vw; top:-20%; left:-15%; background:radial-gradient(circle, var(--orb1), transparent 70%); filter:blur(60px); }
    body::after { width:45vw; height:45vw; bottom:-15%; right:-10%; background:radial-gradient(circle, var(--orb2), transparent 70%); filter:blur(60px); }

    /* Notification panel */
    #status-bar { position:relative; z-index:1; margin:10px 10px 0; min-height:48px; max-height:110px; background:var(--glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid var(--glass-border); border-radius:14px; padding:10px 14px; font-size:12px; flex-shrink:0; overflow-y:auto; }
    #status-bar::-webkit-scrollbar { width:0; }
    .notif-line { display:flex; align-items:flex-start; gap:8px; padding:4px 0; }
    .notif-line:not(:first-child) { opacity:0.45; }
    .notif-dot { width:6px; height:6px; border-radius:50%; margin-top:5px; flex-shrink:0; }
    .notif-dot.info { background:var(--accent); } .notif-dot.success { background:var(--green); }
    .notif-dot.warning { background:var(--yellow); } .notif-dot.error { background:var(--red); }
    .notif-text { flex:1; color:var(--text); line-height:1.4; }
    .notif-time { color:var(--text-dim); font-size:10px; flex-shrink:0; margin-top:2px; }
    .notif-empty { color:var(--text-dim); font-size:11px; }

    /* Grid */
    #grid { position:relative; z-index:1; flex:1; overflow-y:auto; padding:12px; display:grid; grid-template-columns:repeat(3,1fr); grid-auto-rows:1fr; gap:10px; }
    @media(min-width:600px){#grid{grid-template-columns:repeat(4,1fr);}}
    @media(min-width:900px){#grid{grid-template-columns:repeat(5,1fr);}}
    .tile { background:var(--glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid var(--glass-border); border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:10px 6px; cursor:pointer; transition:transform .12s,background .2s,border-color .2s,box-shadow .2s; min-height:80px; }
    .tile:active { transform:scale(0.88); background:var(--glass-strong); border-color:var(--glass-border-active); box-shadow:0 0 24px var(--glass-glow); }
    .tile .tile-icon { width:32px; height:32px; display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--accent); }
    .tile .tile-icon svg { width:28px; height:28px; }
    .tile .tile-icon img { width:32px; height:32px; border-radius:6px; object-fit:contain; filter:brightness(0) invert(1); }
    .tile span { font-size:10px; font-weight:500; text-align:center; line-height:1.2; word-break:break-word; max-width:100%; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; color:var(--text); opacity:.85; }

    /* Config */
    #config { position:relative; z-index:1; flex:1; overflow-y:auto; padding:12px; display:none; }
    #config.active { display:block; }
    #grid.hidden { display:none; }
    .config-item { background:var(--glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid var(--glass-border); border-radius:12px; padding:12px 14px; margin-bottom:8px; display:flex; align-items:center; gap:12px; }
    .config-item svg { width:18px; height:18px; color:var(--accent); flex-shrink:0; }
    .config-item .info { flex:1; min-width:0; }
    .config-item .info p { font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .config-item .info small { font-size:10px; color:var(--text-dim); }
    .config-item .del { background:none; border:none; color:var(--text-dim); font-size:18px; padding:6px 8px; cursor:pointer; border-radius:8px; }
    .config-item .del:active { color:var(--red); }
    .add-btn { width:100%; padding:16px; border:1px dashed rgba(167,139,250,0.2); border-radius:14px; background:var(--accent-soft); color:var(--accent); font-size:13px; font-weight:600; cursor:pointer; margin-bottom:12px; }
    .add-btn:active { border-color:var(--accent); }

    /* Settings section in config */
    .settings-section { margin-top:16px; padding-top:16px; border-top:1px solid var(--glass-border); }
    .settings-section h4 { font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:10px; }
    .theme-grid { display:flex; gap:10px; overflow-x:auto; padding:4px 4px 12px; -webkit-overflow-scrolling:touch; }
    .theme-grid::-webkit-scrollbar { display:none; }
    .theme-btn { width:80px; height:80px; min-width:80px; border-radius:16px; border:2px solid transparent; cursor:pointer; transition:border-color .2s,transform .15s; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .theme-btn.active { border-color:var(--text); transform:scale(1.08); }
    .theme-btn span { font-size:9px; font-weight:600; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,0.5); }
    .sound-toggle { display:flex; align-items:center; gap:10px; padding:10px 0; }
    .sound-toggle span { font-size:13px; flex:1; }
    .toggle { width:44px; height:24px; border-radius:12px; background:var(--glass-border); cursor:pointer; position:relative; transition:background .2s; border:none; }
    .toggle.on { background:var(--accent); }
    .toggle::after { content:''; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:transform .2s; }
    .toggle.on::after { transform:translateX(20px); }

    /* Modal */
    #modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); z-index:100; padding:20px; flex-direction:column; align-items:center; justify-content:center; }
    #modal.active { display:flex; }
    #modal-content { background:rgba(22,22,26,0.95); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:1px solid var(--glass-border); border-radius:20px; padding:24px; width:100%; max-width:360px; }
    #modal-content h3 { font-size:16px; margin-bottom:16px; font-weight:600; }
    .modal-option { display:flex; align-items:center; gap:12px; padding:14px 12px; border-radius:12px; cursor:pointer; margin-bottom:6px; border:none; background:none; width:100%; text-align:left; color:var(--text); }
    .modal-option:active { background:var(--accent-soft); }
    .modal-option .iw { width:38px; height:38px; border-radius:10px; background:var(--accent-soft); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .modal-option .iw svg { width:18px; height:18px; color:var(--accent); }
    .modal-option .label { font-size:13px; font-weight:500; }
    .modal-option .desc { font-size:11px; color:var(--text-dim); margin-top:2px; }
    #modal-step2 input { width:100%; background:rgba(0,0,0,0.4); border:1px solid var(--glass-border); border-radius:12px; padding:14px 16px; color:var(--text); font-size:14px; outline:none; margin-bottom:10px; display:block; transition:border-color .2s; }
    #modal-step2 input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
    #modal-step2 input::placeholder { color:var(--text-dim); }
    #modal-step2 .submit-btn { width:100%; padding:14px; background:var(--accent); color:#000; font-weight:700; font-size:14px; border-radius:12px; border:none; cursor:pointer; margin-top:6px; transition:opacity .15s; }
    #modal-step2 .submit-btn:active { opacity:0.8; }
    /* Apps grid inside modal */
    #apps-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-height:50vh; overflow-y:auto; padding:4px 0; }
    #apps-grid button { display:flex; flex-direction:column; align-items:center; gap:8px; padding:16px 8px; border-radius:14px; border:1px solid var(--glass-border); background:var(--glass); color:var(--text); cursor:pointer; font-size:11px; font-weight:500; text-align:center; word-break:break-word; line-height:1.2; transition:background .15s,border-color .15s,transform .1s; }
    #apps-grid button:active { background:var(--accent-soft); border-color:var(--accent); transform:scale(0.93); }
    #apps-grid button img { width:32px; height:32px; border-radius:8px; filter:brightness(0) invert(1); }
    #apps-grid button i { color:var(--accent); width:28px; height:28px; }
    /* Back button in modal */
    .modal-back { display:flex; align-items:center; justify-content:center; gap:6px; margin-top:14px; padding:12px; border-radius:12px; border:1px solid var(--glass-border); background:none; color:var(--text-dim); font-size:13px; font-weight:500; cursor:pointer; width:100%; transition:background .15s,color .15s; }
    .modal-back:active { background:var(--glass); color:var(--text); }

    /* Form */
    #form { position:relative; z-index:1; display:none; padding:12px; }
    #form.active { display:block; }
    #form-card { background:var(--glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid var(--glass-border); border-radius:14px; padding:16px; }
    #form input { width:100%; background:rgba(0,0,0,0.3); border:1px solid var(--glass-border); border-radius:10px; padding:12px 14px; color:var(--text); font-size:14px; outline:none; margin-bottom:10px; }
    #form input:focus { border-color:var(--accent); }
    #form input::placeholder { color:var(--text-dim); }
    .submit-btn { width:100%; padding:14px; background:var(--accent); color:#000; font-weight:700; font-size:14px; border-radius:12px; border:none; cursor:pointer; margin-top:4px; }
    .submit-btn:active { opacity:0.8; }
    .back-btn { background:none; border:none; color:var(--text-dim); font-size:13px; cursor:pointer; margin-bottom:12px; padding:4px 0; }

    /* Nav */
    #nav { position:relative; z-index:1; display:flex; border-top:1px solid var(--glass-border); background:var(--glass); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); flex-shrink:0; }
    #nav button { flex:1; padding:12px 0 10px; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:10px; font-weight:500; }
    #nav button.active { color:var(--accent); }
    #nav button svg { width:20px; height:20px; }
    .empty { grid-column:1/-1; text-align:center; color:var(--text-dim); padding:80px 20px; font-size:13px; line-height:1.6; }
    .empty b { color:var(--accent); }

    /* Feedback flash */
    .tile.flash-ok { animation: flashOk 0.6s ease; }
    .tile.flash-err { animation: flashErr 0.6s ease; }
    @keyframes flashOk { 0%,100%{box-shadow:none} 30%{box-shadow:0 0 20px var(--green), inset 0 0 10px rgba(74,222,128,0.1); border-color:var(--green)} }
    @keyframes flashErr { 0%,100%{box-shadow:none} 30%{box-shadow:0 0 20px var(--red), inset 0 0 10px rgba(248,113,113,0.1); border-color:var(--red)} }

    /* Category tabs */
    .cat-tabs { display:flex; gap:6px; overflow-x:auto; padding:0 0 10px; margin-bottom:2px; -webkit-overflow-scrolling:touch; }
    .cat-tabs::-webkit-scrollbar { display:none; }
    .cat-tab { padding:6px 14px; border-radius:20px; border:1px solid var(--glass-border); background:transparent; color:var(--text-dim); font-size:11px; font-weight:500; cursor:pointer; white-space:nowrap; flex-shrink:0; transition:all .15s; }
    .cat-tab.active { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }

    /* Confirm dialog */
    #confirm-dialog { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); z-index:200; flex-direction:column; align-items:center; justify-content:center; }
    #confirm-dialog.active { display:flex; }
    #confirm-box { background:rgba(22,22,26,0.95); border:1px solid var(--glass-border); border-radius:20px; padding:24px; width:90%; max-width:300px; text-align:center; }
    #confirm-box p { font-size:14px; margin-bottom:16px; }
    #confirm-box .btns { display:flex; gap:8px; }
    #confirm-box .btns button { flex:1; padding:12px; border-radius:12px; font-size:13px; font-weight:600; cursor:pointer; border:none; }
    #confirm-box .btn-yes { background:var(--red); color:#fff; }
    #confirm-box .btn-no { background:var(--glass); color:var(--text-dim); border:1px solid var(--glass-border); }

    /* Drag */
    .tile.dragging { opacity:0.5; transform:scale(0.95); }
    .tile.drag-over { border-color:var(--accent); box-shadow:0 0 12px var(--glass-glow); }
    ::-webkit-scrollbar { width:0; }
  </style>
</head>
<body>
  <div id="status-bar"><div class="notif-line"><span class="notif-empty">waiting for notifications...</span></div></div>
  <div id="grid"></div>
  <div id="config"></div>
  <div id="form">
    <button class="back-btn" onclick="showConfig()">← Back</button>
    <div id="form-card">
      <form id="action-form">
        <input id="f-label" placeholder="Button name" required>
        <input id="f-icon" placeholder="Custom icon URL (optional)">
        <input id="f-value" placeholder="Value" required>
        <button type="submit" class="submit-btn">Add</button>
      </form>
    </div>
  </div>
  <div id="modal">
    <div id="modal-content">
      <h3 id="modal-title">Add action</h3>
      <div id="modal-step1">
        <button class="modal-option" data-type="url"><div class="iw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></div><div><div class="label">Open a link</div><div class="desc">Website, URL</div></div></button>
        <button class="modal-option" data-type="copy"><div class="iw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></div><div><div class="label">Copy text</div><div class="desc">Copy to PC clipboard</div></div></button>
        <button class="modal-option" data-type="command"><div class="iw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg></div><div><div class="label">Run command</div><div class="desc">Execute on PC</div></div></button>
        <button class="modal-option" data-type="apps"><div class="iw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></div><div><div class="label">Open app</div><div class="desc">From installed apps</div></div></button>
      </div>
      <div id="modal-step2" style="display:none">
        <form id="modal-form">
          <input id="mf-label" placeholder="" required>
          <input id="mf-value" required>
          <input id="mf-icon" placeholder="">
          <input id="mf-category" placeholder="">
          <label style="display:flex;align-items:center;gap:8px;padding:8px 0;font-size:12px;color:var(--text-dim);cursor:pointer"><input type="checkbox" id="mf-confirm" style="width:16px;height:16px;accent-color:var(--accent)"> <span id="mf-confirm-label"></span></label>
          <button type="submit" class="submit-btn" id="mf-submit-btn"></button>
        </form>
        <button class="modal-back" id="back-btn-form" onclick="modalBack()"></button>
      </div>
      <div id="modal-step-apps" style="display:none">
        <div id="apps-grid"></div>
        <button class="modal-back" id="back-btn-apps" onclick="modalBack()"></button>
      </div>
    </div>
  </div>
  <div id="confirm-dialog">
    <div id="confirm-box">
      <p id="confirm-msg"></p>
      <div class="btns">
        <button class="btn-no" onclick="cancelConfirm()" id="confirm-cancel-btn">Cancel</button>
        <button class="btn-yes" onclick="doConfirm()" id="confirm-exec-btn">Execute</button>
      </div>
    </div>
  </div>
  <div id="nav">
    <button id="nav-deck" class="active" onclick="showDeck()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>Deck</button>
    <button id="nav-config" onclick="showConfig()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Config</button>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js" onerror="window.lucide={createIcons:function(){}}"></script>
  <script>
    // ─── i18n ───
    const i18n = {
      en: {
        waiting: 'waiting for notifications...',
        connected: 'connected',
        connError: 'cannot reach server',
        disconnected: 'disconnected',
        noActions: 'No actions yet.',
        tapConfig: 'Tap <b>Config</b> to add.',
        addAction: '+ Add action',
        actions: 'Actions',
        settings: 'Settings',
        workspaces: 'Workspaces',
        theme: 'Theme',
        sound: 'Sound',
        language: 'Language',
        notifSound: 'Notification sound',
        scan: 'Scan',
        manual: 'Manual',
        addPc: 'Add PC',
        deck: 'Deck',
        config: 'Config',
        addActionTitle: 'Add action',
        openLink: 'Open a link',
        openLinkDesc: 'Website, URL',
        copyText: 'Copy text',
        copyTextDesc: 'Copy to PC clipboard',
        runCommand: 'Run command',
        runCommandDesc: 'Execute on PC',
        openApp: 'Open app',
        openAppDesc: 'From installed apps',
        buttonName: 'Button name',
        customIcon: 'Custom icon URL (optional)',
        addToDeck: 'Add to deck',
        back: '← Back',
        agentNotConnected: 'Agent not connected. Start agent on PC.',
        addLink: 'Add link',
        addCopy: 'Add copy action',
        addCommand: 'Add command',
        selectApp: 'Select app',
        namePrompt: 'Name (e.g. Work PC)',
        ipPrompt: 'IP address (e.g. 192.168.1.50)',
        scanning: 'Scanning...',
        noNewPcs: 'No new PCs found',
        foundAt: 'Found Deck at',
        category: 'Category (optional, e.g. Dev, Media)',
        requireConfirm: 'Require confirmation',
        confirmExec: 'Execute',
        confirmCancel: 'Cancel',
        all: 'All',
      },
      es: {
        waiting: 'esperando notificaciones...',
        connected: 'conectado',
        connError: 'no se puede conectar',
        disconnected: 'desconectado',
        noActions: 'No hay acciones.',
        tapConfig: 'Toca <b>Config</b> para agregar.',
        addAction: '+ Agregar acción',
        actions: 'Acciones',
        settings: 'Ajustes',
        workspaces: 'Espacios',
        theme: 'Tema',
        sound: 'Sonido',
        language: 'Idioma',
        notifSound: 'Sonido de notificación',
        scan: 'Buscar',
        manual: 'Manual',
        addPc: 'Agregar PC',
        deck: 'Deck',
        config: 'Config',
        addActionTitle: 'Agregar acción',
        openLink: 'Abrir enlace',
        openLinkDesc: 'Sitio web, URL',
        copyText: 'Copiar texto',
        copyTextDesc: 'Copiar al portapapeles del PC',
        runCommand: 'Ejecutar comando',
        runCommandDesc: 'Ejecutar en el PC',
        openApp: 'Abrir app',
        openAppDesc: 'De las apps instaladas',
        buttonName: 'Nombre del botón',
        customIcon: 'URL de icono (opcional)',
        addToDeck: 'Agregar al deck',
        back: '← Volver',
        agentNotConnected: 'Agent no conectado. Inicia el agent en tu PC.',
        addLink: 'Agregar enlace',
        addCopy: 'Agregar copia',
        addCommand: 'Agregar comando',
        selectApp: 'Seleccionar app',
        namePrompt: 'Nombre (ej. PC Trabajo)',
        ipPrompt: 'Dirección IP (ej. 192.168.1.50)',
        scanning: 'Buscando...',
        noNewPcs: 'No se encontraron PCs',
        foundAt: 'Deck encontrado en',
        category: 'Categoría (opcional, ej. Dev, Media)',
        requireConfirm: 'Requiere confirmación',
        confirmExec: 'Ejecutar',
        confirmCancel: 'Cancelar',
        all: 'Todos',
      }
    };
    let lang = localStorage.getItem('deck-lang') || (navigator.language.startsWith('es') ? 'es' : 'en');
    function t(key) { return i18n[lang]?.[key] || i18n.en[key] || key; }

    let actions = [];
    let currentType = 'url';
    let notifications = [];
    let soundEnabled = JSON.parse(localStorage.getItem('deck-sound') || 'true');
    let currentTheme = localStorage.getItem('deck-theme') || 'midnight';
    let configTab = 'actions';

    // Role: host can edit actions.
    // localhost/127.0.0.1 = always host. Remote IP = check server.
    let isHost = (location.hostname === 'localhost' || location.hostname === '127.0.0.1');

    // Workspaces
    let workspaces = JSON.parse(localStorage.getItem('deck-workspaces') || '[]');
    let activeWorkspace = localStorage.getItem('deck-active-workspace') || location.origin;
    let socket;

    function connectTo(serverUrl) {
      if (socket) socket.disconnect();
      activeWorkspace = serverUrl;
      localStorage.setItem('deck-active-workspace', serverUrl);
      actions = [];
      notifications = [];
      renderGrid();
      renderNotifs();

      // Also check via server if accessing from same machine IP
      if (!isHost) {
        fetch(location.origin + '/health').then(r => r.json()).then(d => {
          if (d.isLocal) { isHost = true; renderConfig(); }
        }).catch(() => {});
      }

      socket = io(serverUrl, { transports: ['polling', 'websocket'] });
      socket.on('connect', () => addNotif(t('connected'), 'success'));
      socket.on('connect_error', () => addNotif(t('connError'), 'error'));
      socket.on('disconnect', () => addNotif(t('disconnected'), 'warning'));
      socket.on('config:actions', (data) => { actions = data; renderGrid(); renderConfig(); });
      socket.on('notification:new', (n) => { addNotif(n.title, n.level); playNotifSound(); });
    }
    // Auto-add current origin as workspace if not in list
    if (!workspaces.find(w => w.url === location.origin)) {
      workspaces.push({ name: location.hostname === 'localhost' ? 'This PC' : location.hostname, url: location.origin });
      localStorage.setItem('deck-workspaces', JSON.stringify(workspaces));
    }

    connectTo(activeWorkspace);

    document.documentElement.dataset.theme = currentTheme;

    // Sound
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playNotifSound() {
      if (!soundEnabled) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      osc.frequency.setValueAtTime(1100, audioCtx.currentTime + 0.05);
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
      osc.start(); osc.stop(audioCtx.currentTime + 0.15);
    }

    // Socket
    socket.on('connect', () => addNotif('connected', 'success'));
    socket.on('connect_error', () => addNotif('connection error', 'error'));
    socket.on('disconnect', () => addNotif('reconnecting...', 'warning'));
    socket.on('config:actions', (data) => { actions = data; renderGrid(); renderConfig(); });
    socket.on('notification:new', (n) => { addNotif(n.title, n.level); playNotifSound(); });

    function addNotif(text, level) {
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      notifications.unshift({ text, level, time });
      if (notifications.length > 20) notifications.pop();
      renderNotifs();
    }
    function renderNotifs() {
      const el = document.getElementById('status-bar');
      if (!notifications.length) { el.innerHTML = `<div class="notif-line"><span class="notif-empty">${t('waiting')}</span></div>`; return; }
      el.innerHTML = notifications.slice(0, 8).map(n =>
        `<div class="notif-line"><span class="notif-dot ${n.level}"></span><span class="notif-text">${n.text}</span><span class="notif-time">${n.time}</span></div>`
      ).join('');
    }

    // Tile icon: custom image URL only if set, otherwise Lucide
    function getTileIcon(a) {
      if (a.icon && a.icon.startsWith('http')) return `<div class="tile-icon"><img src="${a.icon}" alt="" onerror="this.style.display='none'"></div>`;
      const lucideMap = { url: 'globe', copy: 'clipboard', command: 'terminal' };
      return `<div class="tile-icon"><i data-lucide="${lucideMap[a.type] || 'zap'}"></i></div>`;
    }

    let activeCategory = 'all';
    let pendingConfirmId = null;

    function getCategories() {
      const cats = new Set(actions.map(a => a.category || 'General'));
      return ['all', ...cats];
    }

    function renderGrid() {
      const el = document.getElementById('grid');
      if (!actions.length) { el.innerHTML = `<div class="empty">${t('noActions')}<br>${t('tapConfig')}</div>`; return; }

      const cats = getCategories();
      const filtered = activeCategory === 'all' ? actions : actions.filter(a => (a.category || 'General') === activeCategory);

      let html = '';
      if (cats.length > 2) {
        html += `<div class="cat-tabs" style="grid-column:1/-1">`;
        html += cats.map(c => `<button class="cat-tab ${activeCategory===c?'active':''}" onclick="setCategory('${c}')">${c === 'all' ? t('all') : c}</button>`).join('');
        html += `</div>`;
      }
      html += filtered.map(a => `<div class="tile" data-action-id="${a.id}" draggable="${isHost}" ondragstart="dragStart(event,'${a.id}')" ondragover="dragOver(event)" ondrop="drop(event,'${a.id}')" ondragend="dragEnd(event)">${getTileIcon(a)}<span>${a.label}</span>${a.confirm?'<div style="position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--red)"></div>':''}</div>`).join('');

      el.innerHTML = html;
      lucide.createIcons();
    }

    function setCategory(cat) { activeCategory = cat; renderGrid(); }

    // Event delegation for tile clicks
    document.getElementById('grid').addEventListener('click', (e) => {
      const tile = e.target.closest('[data-action-id]');
      if (tile) exec(tile.dataset.actionId);
    });

    function exec(id) {
      const action = actions.find(a => a.id === id);
      if (!action) return;
      if (action.confirm) {
        pendingConfirmId = id;
        document.getElementById('confirm-msg').textContent = `${t('confirmExec')} "${action.label}"?`;
        document.getElementById('confirm-cancel-btn').textContent = t('confirmCancel');
        document.getElementById('confirm-exec-btn').textContent = t('confirmExec');
        document.getElementById('confirm-dialog').classList.add('active');
        return;
      }
      doExec(id);
    }

    function doConfirm() {
      document.getElementById('confirm-dialog').classList.remove('active');
      if (pendingConfirmId) doExec(pendingConfirmId);
      pendingConfirmId = null;
    }
    function cancelConfirm() {
      document.getElementById('confirm-dialog').classList.remove('active');
      pendingConfirmId = null;
    }

    function doExec(id) {
      if (!socket || !socket.connected) { addNotif(lang==='es'?'No conectado al servidor':'Not connected to server', 'error'); return; }
      socket.emit('action:execute', id);
      const tile = document.querySelector(`[data-action-id="${id}"]`);
      if (tile) { tile.classList.add('flash-ok'); setTimeout(() => tile.classList.remove('flash-ok'), 600); }
    }

    // Listen for execution results from server
    if (socket) socket.on('action:result', (data) => {
      const tile = document.getElementById('tile-' + data.id);
      if (!tile) return;
      tile.classList.remove('flash-ok');
      tile.classList.add(data.success ? 'flash-ok' : 'flash-err');
      setTimeout(() => tile.classList.remove('flash-ok', 'flash-err'), 600);
    });

    // Drag & drop reorder (host only)
    let dragId = null;
    function dragStart(e, id) { dragId = id; e.target.classList.add('dragging'); }
    function dragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
    function dragEnd(e) { e.target.classList.remove('dragging'); document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over')); }
    function drop(e, targetId) {
      e.preventDefault(); e.currentTarget.classList.remove('drag-over');
      if (!dragId || dragId === targetId) return;
      const fromIdx = actions.findIndex(a => a.id === dragId);
      const toIdx = actions.findIndex(a => a.id === targetId);
      if (fromIdx < 0 || toIdx < 0) return;
      const [item] = actions.splice(fromIdx, 1);
      actions.splice(toIdx, 0, item);
      save();
      dragId = null;
    }

    function renderConfig() {
      const el = document.getElementById('config');
      let html = '';

      if (isHost) {
        // Host: tabs Actions / Connect / Settings
        html += `<div style="display:flex;gap:4px;margin-bottom:12px;">`;
        html += `<button onclick="configTab='actions';renderConfig()" style="flex:1;padding:10px;border-radius:10px;border:1px solid ${configTab==='actions'?'var(--accent)':'var(--glass-border)'};background:${configTab==='actions'?'var(--accent-soft)':'transparent'};color:${configTab==='actions'?'var(--accent)':'var(--text-dim)'};font-size:12px;font-weight:600;cursor:pointer">${t('actions')}</button>`;
        html += `<button onclick="configTab='connect';renderConfig()" style="flex:1;padding:10px;border-radius:10px;border:1px solid ${configTab==='connect'?'var(--accent)':'var(--glass-border)'};background:${configTab==='connect'?'var(--accent-soft)':'transparent'};color:${configTab==='connect'?'var(--accent)':'var(--text-dim)'};font-size:12px;font-weight:600;cursor:pointer">Connect</button>`;
        html += `<button onclick="configTab='settings';renderConfig()" style="flex:1;padding:10px;border-radius:10px;border:1px solid ${configTab==='settings'?'var(--accent)':'var(--glass-border)'};background:${configTab==='settings'?'var(--accent-soft)':'transparent'};color:${configTab==='settings'?'var(--accent)':'var(--text-dim)'};font-size:12px;font-weight:600;cursor:pointer">${t('settings')}</button>`;
        html += `</div>`;

        if (configTab === 'actions') {
          html += `<button class="add-btn" onclick="openModal()">${t('addAction')}</button>`;
          html += actions.map(a => {
            const iconHtml = a.icon && a.icon.startsWith('http') ? `<img src="${a.icon}" style="width:20px;height:20px;border-radius:4px">` : `<i data-lucide="${{url:'globe',copy:'clipboard',command:'terminal'}[a.type]||'zap'}" style="width:18px;height:18px;color:var(--accent)"></i>`;
            return `<div class="config-item">${iconHtml}<div class="info"><p>${a.label}</p><small>${a.type}</small></div><button class="del" onclick="del('${a.id}')">×</button></div>`;
          }).join('');
        } else if (configTab === 'connect') {
          html += `<div style="text-align:center;padding:20px 0"><p style="font-size:13px;color:var(--text-dim);margin-bottom:16px">${lang==='es'?'Escanea con tu tablet o teléfono':'Scan with your tablet or phone'}</p><img src="/qr" style="width:200px;height:200px;margin:0 auto;display:block;border-radius:12px"><p id="qr-url" style="margin-top:12px;font-size:13px;color:var(--accent);font-family:monospace"></p></div>`;
        } else {
          html += renderSettings();
        }
      } else {
        // Tablet: only settings (theme + sound)
        html += `<h3 style="font-size:14px;font-weight:600;margin-bottom:14px">Settings</h3>`;
        html += renderSettings();
      }

      el.innerHTML = html;
      lucide.createIcons();
      if (configTab === 'connect' && isHost) {
        fetch('/health').then(r=>r.json()).then(d => {
          const el = document.getElementById('qr-url');
          if (el && d.url) el.textContent = d.url;
        }).catch(()=>{});
      }
    }

    function renderSettings() {
      const themes = [{id:'midnight',color:'#a78bfa',name:'Midnight'},{id:'ocean',color:'#38bdf8',name:'Ocean'},{id:'ember',color:'#fb923c',name:'Ember'},{id:'forest',color:'#4ade80',name:'Forest'},{id:'rose',color:'#f472b6',name:'Rose'},{id:'ice',color:'#67e8f9',name:'Ice'},{id:'gold',color:'#fbbf24',name:'Gold'},{id:'crimson',color:'#f43f5e',name:'Crimson'}];
      let html = `<div style="border:none;margin:0;padding:0">`;
      // Workspaces only for tablet (not host)
      if (!isHost) {
        html += `<h4 style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px">${t('workspaces')}</h4>`;
        html += workspaces.map(w => `<div class="config-item" style="cursor:pointer;${w.url===activeWorkspace?'border-color:var(--accent);background:var(--accent-soft)':''}" onclick="switchWorkspace('${w.url}')"><div style="width:8px;height:8px;border-radius:50%;background:${w.url===activeWorkspace?'var(--green)':'var(--text-dim)'};flex-shrink:0"></div><div class="info"><p>${w.name}</p><small>${w.url}</small></div><button class="del" onclick="event.stopPropagation();removeWorkspace('${w.url}')">×</button></div>`).join('');
        html += `<div style="display:flex;gap:8px;margin-top:8px"><button class="add-btn" onclick="scanForHosts()" style="flex:1;margin:0;padding:12px" id="scan-btn"><i data-lucide="radar" style="width:14px;height:14px;display:inline;vertical-align:middle;margin-right:4px"></i> ${t('scan')}</button><button class="add-btn" onclick="addWorkspaceManual()" style="flex:1;margin:0;padding:12px"><i data-lucide="plus" style="width:14px;height:14px;display:inline;vertical-align:middle;margin-right:4px"></i> ${t('manual')}</button></div>`;
        html += `<div style="margin-top:20px"></div>`;
      }
      html += `<h4 style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;margin-top:20px">${t('theme')}</h4><div class="theme-grid">`;
      html += themes.map(th => `<button class="theme-btn ${currentTheme===th.id?'active':''}" style="background:${th.color}" onclick="setTheme('${th.id}')"><span>${th.name}</span></button>`).join('');
      html += `</div>`;
      html += `<h4 style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;margin-top:16px">${t('language')}</h4>`;
      html += `<div style="display:flex;gap:8px"><button onclick="setLang('en')" style="flex:1;padding:10px;border-radius:10px;border:1px solid ${lang==='en'?'var(--accent)':'var(--glass-border)'};background:${lang==='en'?'var(--accent-soft)':'transparent'};color:${lang==='en'?'var(--accent)':'var(--text-dim)'};font-size:12px;font-weight:600;cursor:pointer">English</button><button onclick="setLang('es')" style="flex:1;padding:10px;border-radius:10px;border:1px solid ${lang==='es'?'var(--accent)':'var(--glass-border)'};background:${lang==='es'?'var(--accent-soft)':'transparent'};color:${lang==='es'?'var(--accent)':'var(--text-dim)'};font-size:12px;font-weight:600;cursor:pointer">Español</button></div>`;
      html += `<h4 style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;margin-top:16px">${t('sound')}</h4><div class="sound-toggle"><span>${t('notifSound')}</span><button class="toggle ${soundEnabled?'on':''}" onclick="toggleSound()"></button></div>`;
      html += `<h4 style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;margin-top:16px">Updates</h4><div id="update-section" style="font-size:12px;color:var(--text-dim)"></div>`;
      html += `</div>`;
      return html;
    }

    function setLang(l) { lang = l; localStorage.setItem('deck-lang', l); renderConfig(); renderGrid(); renderNotifs(); }

    const CURRENT_VERSION = '0.2.0';
    const REPO = 'florextech/deck';

    function checkForUpdates() {
      const el = document.getElementById('update-section');
      if (!el) return;
      el.innerHTML = `<span style="color:var(--text-dim)">${lang==='es'?'Verificando...':'Checking...'}</span>`;
      fetch(`https://api.github.com/repos/${REPO}/releases/latest`).then(r => r.json()).then(d => {
        const latest = (d.tag_name || '').replace('v', '');
        if (!latest) { el.innerHTML = `<span>v${CURRENT_VERSION} (${lang==='es'?'actualizado':'up to date'})</span>`; return; }
        if (latest === CURRENT_VERSION) {
          el.innerHTML = `<span style="color:var(--green)">v${CURRENT_VERSION} ✓ ${lang==='es'?'Estás actualizado':'Up to date'}</span>`;
        } else {
          el.innerHTML = `<div style="display:flex;flex-direction:column;gap:8px"><span style="color:var(--accent)">v${latest} ${lang==='es'?'disponible':'available'} (${lang==='es'?'tienes':'current'} v${CURRENT_VERSION})</span><a href="https://github.com/${REPO}/releases/latest" target="_blank" style="display:inline-block;padding:10px 16px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12px;text-decoration:none;text-align:center">${lang==='es'?'Descargar actualización':'Download update'}</a></div>`;
        }
      }).catch(() => { el.innerHTML = `<span style="color:var(--text-dim)">${lang==='es'?'No se pudo verificar':'Could not check'}</span>`; });
    }

    // Check on settings render
    const origRenderConfig = renderConfig;
    renderConfig = function() { origRenderConfig(); if (configTab === 'settings') setTimeout(checkForUpdates, 200); };

    function switchWorkspace(url) { connectTo(url); renderConfig(); }
    function removeWorkspace(url) {
      if (workspaces.length <= 1) return;
      workspaces = workspaces.filter(w => w.url !== url);
      localStorage.setItem('deck-workspaces', JSON.stringify(workspaces));
      if (activeWorkspace === url) connectTo(workspaces[0].url);
      renderConfig();
    }
    function addWorkspaceManual() {
      const name = prompt('Name (e.g. Work PC)');
      if (!name) return;
      const ip = prompt('IP address (e.g. 192.168.1.50)');
      if (!ip) return;
      const url = ip.includes('://') ? ip : `http://${ip}:4000`;
      workspaces.push({ name, url });
      localStorage.setItem('deck-workspaces', JSON.stringify(workspaces));
      renderConfig();
    }

    async function scanForHosts() {
      const btn = document.getElementById('scan-btn');
      btn.textContent = 'Scanning...';
      btn.style.opacity = '0.5';
      const parts = location.hostname.split('.');
      const subnet = parts.slice(0, 3).join('.');
      const found = [];
      const promises = [];
      for (let i = 1; i <= 254; i++) {
        const url = `http://${subnet}.${i}:4000`;
        if (workspaces.find(w => w.url === url)) continue;
        promises.push(fetch(`${url}/health`, { signal: AbortSignal.timeout(1500) }).then(r => r.json()).then(d => { if (d.status === 'ok') found.push({ ip: `${subnet}.${i}`, url, actions: d.actions }); }).catch(() => {}));
      }
      await Promise.all(promises);
      if (!found.length) { btn.innerHTML = 'No new PCs found'; setTimeout(() => renderConfig(), 2000); return; }
      for (const h of found) {
        const name = prompt(`Found Deck at ${h.ip}. Name:`, h.ip);
        if (name) workspaces.push({ name, url: h.url });
      }
      localStorage.setItem('deck-workspaces', JSON.stringify(workspaces));
      renderConfig();
    }

    function setTheme(id) { currentTheme = id; document.documentElement.dataset.theme = id; localStorage.setItem('deck-theme', id); renderConfig(); }
    function toggleSound() { soundEnabled = !soundEnabled; localStorage.setItem('deck-sound', JSON.stringify(soundEnabled)); renderConfig(); }

    function del(id) { actions = actions.filter(a => a.id !== id); save(); }
    function save() { fetch(activeWorkspace + '/config', { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({actions}) }); renderGrid(); renderConfig(); }

    function showDeck() { document.getElementById('grid').classList.remove('hidden'); document.getElementById('config').classList.remove('active'); document.getElementById('nav-deck').classList.add('active'); document.getElementById('nav-config').classList.remove('active'); }
    function showConfig() { document.getElementById('grid').classList.add('hidden'); document.getElementById('config').classList.add('active'); document.getElementById('nav-deck').classList.remove('active'); document.getElementById('nav-config').classList.add('active'); renderConfig(); }

    function openModal() { document.getElementById('modal').classList.add('active'); document.getElementById('modal-step1').style.display=''; document.getElementById('modal-step2').style.display='none'; document.getElementById('modal-step-apps').style.display='none'; document.getElementById('modal-title').textContent=t('addActionTitle'); document.getElementById('back-btn-form').textContent=t('back'); document.getElementById('back-btn-apps').textContent=t('back'); }
    function closeModal() { document.getElementById('modal').classList.remove('active'); }
    function modalBack() { document.getElementById('modal-step1').style.display=''; document.getElementById('modal-step2').style.display='none'; document.getElementById('modal-step-apps').style.display='none'; document.getElementById('modal-title').textContent='Add action'; }

    document.querySelectorAll('.modal-option').forEach(opt => {
      opt.onclick = () => {
        currentType = opt.dataset.type;
        if (currentType === 'apps') {
          document.getElementById('modal-title').textContent = t('selectApp');
          document.getElementById('modal-step1').style.display='none';
          document.getElementById('modal-step-apps').style.display='';
          loadApps();
          return;
        }
        const titles = {url:t('addLink'),copy:t('addCopy'),command:t('addCommand')};
        const ph = {url:'https://...',copy:t('copyText'),command:'docker restart...'};
        document.getElementById('modal-title').textContent = titles[currentType] || '';
        document.getElementById('mf-value').placeholder = ph[currentType] || '';
        document.getElementById('mf-label').placeholder = t('buttonName');
        document.getElementById('mf-icon').placeholder = t('customIcon');
        document.getElementById('mf-category').placeholder = t('category');
        document.getElementById('mf-confirm-label').textContent = t('requireConfirm');
        document.getElementById('mf-submit-btn').textContent = t('addToDeck');
        document.getElementById('modal-step1').style.display='none';
        document.getElementById('modal-step2').style.display='';
      };
    });

    function loadApps() {
      fetch(activeWorkspace + '/apps').then(r => r.json()).then(data => {
        const grid = document.getElementById('apps-grid');
        if (!data.apps || !data.apps.length) { grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--text-dim);padding:20px;font-size:12px">Agent not connected.<br>Start agent on your PC.</p>'; return; }
        grid.innerHTML = data.apps.map(a => {
          const iconHtml = a.icon ? `<img src="${a.icon}" alt="" onerror="this.style.display='none'">` : `<i data-lucide="app-window"></i>`;
          return `<button onclick="addApp('${a.name.replace(/'/g,"\\'")}','${a.command.replace(/'/g,"\\'")}','${(a.icon||'').replace(/'/g,"\\'")}')">${iconHtml}<span>${a.name}</span></button>`;
        }).join('');
        lucide.createIcons();
      }).catch(() => { document.getElementById('apps-grid').innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--text-dim);padding:20px;font-size:12px">Could not load apps</p>'; });
    }

    function addApp(name, command, icon) {
      actions.push({ id: crypto.randomUUID(), label: name, icon: icon || undefined, type: 'command', payload: { type: 'command', command } });
      save(); closeModal();
    }
    document.getElementById('modal').onclick = (e) => { if (e.target.id === 'modal') closeModal(); };

    document.getElementById('modal-form').onsubmit = (e) => {
      e.preventDefault();
      const label = document.getElementById('mf-label').value;
      const icon = document.getElementById('mf-icon').value || undefined;
      const category = document.getElementById('mf-category').value || undefined;
      const confirm = document.getElementById('mf-confirm').checked || undefined;
      const value = document.getElementById('mf-value').value;
      const payload = currentType==='url'?{type:'url',url:value}:currentType==='copy'?{type:'copy',text:value}:{type:'command',command:value};
      actions.push({ id: crypto.randomUUID(), label, icon, category, confirm, type: currentType, payload });
      save();
      document.getElementById('mf-label').value = '';
      document.getElementById('mf-icon').value = '';
      document.getElementById('mf-value').value = '';
      document.getElementById('mf-category').value = '';
      document.getElementById('mf-confirm').checked = false;
      closeModal();
    };

    renderGrid();
  </script>
</body>
</html>
