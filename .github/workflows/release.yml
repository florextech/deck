name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            build_cmd: npm run build:mac
            artifact: "dist/{*.dmg,*.zip,*.yml}"
          - os: windows-latest
            build_cmd: npm run build:win
            artifact: "dist/{*.exe,*.yml}"
          - os: ubuntu-latest
            build_cmd: npm run build:linux
            artifact: "dist/{*.AppImage,*.yml}"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cd electron && npm install
      - name: Set version from tag
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cd electron && npm version $VERSION --no-git-tag-version
      - name: Build
        run: cd electron && ${{ matrix.build_cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: deck-${{ matrix.os }}
          path: electron/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: deck-*
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/florextech/deck:latest
            ghcr.io/florextech/deck:${{ github.ref_name }}
