services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    ports:
      - "3100:3000"
    environment:
      - NEXT_PUBLIC_SERVER_URL=http://server:4000
    depends_on:
      - server

  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
