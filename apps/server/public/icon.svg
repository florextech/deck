<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0a0a0f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c4b5fd"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Grid tiles -->
  <rect x="80" y="80" width="150" height="150" rx="28" fill="url(#accent)" opacity="0.9"/>
  <rect x="282" y="80" width="150" height="150" rx="28" fill="url(#accent)" opacity="0.6"/>
  <rect x="80" y="282" width="150" height="150" rx="28" fill="url(#accent)" opacity="0.6"/>
  <rect x="282" y="282" width="150" height="150" rx="28" fill="url(#accent)" opacity="0.35"/>
  <!-- Glow dot -->
  <circle cx="155" cy="155" r="20" fill="#fff" opacity="0.9"/>
</svg>
